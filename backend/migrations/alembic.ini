# Alembic configuration. Read ONLY by the entrypoint's `migrate` command (SRC-002 §7.8):
#   alembic -c migrations/alembic.ini upgrade head        (run from /srv, the image's WORKDIR)
# No database URL lives here: env.py reads DATABASE_URL from the environment, exactly as the API
# does, so the one-off migrate task is configured the same way as the service (P-XCT-19).
[alembic]
script_location = %(here)s
# Without this the revision files are only found when the command runs from this directory.
prepend_sys_path = .
