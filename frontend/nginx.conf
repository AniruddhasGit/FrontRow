# =====================================================================================================
# nginx for the FrontRow static frontend  -  ZONE B. Replaces the image's /etc/nginx/nginx.conf.
# Every production line says what breaks without it.
# =====================================================================================================

# One worker. Without this nginx starts one per CPU; on a t3.micro that is 2 processes doing the work
# of one, for a site that serves a handful of static files. (Memory budget ~15 MB, P-XCT-21.)
worker_processes 1;

# Logs to the container's stdout/stderr, never a file on disk (SRC-002 §5.4.5). Without this the
# official image's default writes to /var/log/nginx, which on a read-only filesystem fails at start.
error_log /dev/stderr warn;

# The pid file in /tmp: the process runs as the unprivileged `nginx` user, which cannot write the
# default /var/run/nginx.pid, and nginx refuses to start without a writable pid path.
pid /tmp/nginx.pid;

events {
  # Simultaneous connections per worker. Without it nginx uses 512, each with buffers preallocated;
  # 256 is far above what one theatre's static files need and keeps the worker inside its 15 MB.
  # Too low, and a burst of browsers gets connection resets while the site looks idle.
  worker_connections 256;
}

http {
  # Maps file extensions to Content-Type. Without it every file is served as default_type below, the
  # browser refuses to run the script (strict MIME checking for module scripts) and the page is blank.
  include /etc/nginx/mime.types;
  # The type for an extension the map does not know. octet-stream makes the browser download it rather
  # than guess and render it - guessing ("sniffing") is how an uploaded text file executes as HTML.
  default_type application/octet-stream;

  # Temp paths in /tmp for the same reason as the pid file: without them nginx tries
  # /var/cache/nginx, which the non-root user cannot write, and exits at start.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # One JSON object per request on stdout, so the frontend's access log is queryable in CloudWatch
  # in the same way as the API's. (nginx's own error log above cannot be JSON; it is rare and short.)
  # - "route" is $uri, the path WITHOUT the query string - never $request_uri. Without that, a future
  #   link carrying ?token=... (a password-reset link, SRC-004 R-3) is written into CloudWatch in full.
  # - "duration_s" is $request_time, which nginx reports in SECONDS (millisecond resolution). Naming it
  #   duration_ms would make 0.002 read as two microseconds next to the API's real duration_ms.
  # - escape=json makes nginx escape quotes, backslashes and control characters inside the values.
  #   Without it a request path containing a `"` (anyone can send one) ends the JSON string early,
  #   the line is not valid JSON, and CloudWatch Logs Insights cannot parse it - so the requests an
  #   attacker sends are exactly the ones that vanish from queries.
  log_format json escape=json '{"timestamp":"$time_iso8601","level":"INFO","logger":"nginx",'
    '"message":"request completed","service":"frontend","request_id":"$request_id",'
    '"method":"$request_method","route":"$uri","status_code":$status,'
    '"duration_s":$request_time}';
  # The container health check (Dockerfile HEALTHCHECK, and an ECS container healthCheck) polls from
  # inside the container, so it is the only client that arrives from 127.0.0.1 - an address an outside
  # client cannot forge. Without this map, a poll every 30 s is ~2,900 lines a day of nothing.
  map $remote_addr $loggable {
    127.0.0.1 0;
    default   1;
  }
  access_log /dev/stdout json if=$loggable;

  # Without it, every response and error page names the exact nginx version, which tells a scanner
  # which published vulnerabilities to try.
  server_tokens off;
  # The kernel copies the file straight to the socket. Without it nginx reads every file into a
  # user-space buffer first: more memory per request in a container capped at 15 MB, for no benefit.
  sendfile on;

  server {
    # 8080, not 80: a non-root process cannot bind a port below 1024. The frontend target group and
    # its security group rule must point at 8080 (Zone C).
    listen 8080;
    # Where the Dockerfile copies the built files. Without it nginx serves from its compiled-in
    # default (`html` under its install prefix), which is not where dist/ was copied: every request
    # is a 404, the health check's fetch of index.html fails too, and the task restarts in a loop.
    root /usr/share/nginx/html;

    # Hashed asset filenames change on every build, so they can be cached for a long time. Without
    # this every page view re-downloads the 220 kB script.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      # A missing asset is a real 404. Without this line the request would fall through to the
      # `location /` fallback below and return index.html with status 200 - and with the year-long
      # cache header above, a browser stores an HTML page as a script and the site stays blank for
      # that user until the cache is cleared.
      try_files $uri =404;
    }

    # index.html must NOT be cached: it is the file that names the current hashed assets, and a
    # cached copy keeps loading the previous deploy's script after you have shipped a new one.
    location / {
      add_header Cache-Control "no-cache";
      # A client-side route (/movies/42 - none exist yet; they arrive with the Phase 3 pages) has no
      # file on disk; the React app resolves it in the browser. Without falling back to /index.html,
      # refreshing the page or opening a shared link on any route other than / returns a 404.
      try_files $uri /index.html;
    }
  }
}
